name: Refresh AI updates for Netlify

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect updates and generate review drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_ai_feed.py
      - name: Save drafts as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-drafts-${{ github.run_id }}
          path: drafts/ai-updates/*.md
          retention-days: 30
      - name: Update the Netlify data source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/ai-updates/data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh AI tool updates'
            git push
          fi
